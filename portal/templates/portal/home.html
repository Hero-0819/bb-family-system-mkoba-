{% extends "portal/base.html" %}


{% block title %}

BB Family Member Portal

{% endblock %}



{% block content %}


<div class="container mt-5">


<div class="text-center">


<h1 class="fw-bold">

BB FAMILY

</h1>


<h4 class="text-muted">

M-KOBA MANAGEMENT SYSTEM

</h4>


<p class="mt-3">

Pamoja Tunajenga Maendeleo Yetu

</p>


</div>




<div class="card shadow p-4 mt-5 mx-auto"
style="max-width:450px;">


<h4 class="text-center mb-4">

Check Your Contribution

</h4>



<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Member Number

</label>


<input type="text"
class="form-control"
name="member_number"
placeholder="BB001">

</div>




<div class="mb-3">


<label class="form-label">

Phone Number

</label>


<input type="text"
class="form-control"
name="phone_number"
placeholder="07XXXXXXXX">


</div>



<button class="btn btn-primary w-100">

<i class="bi bi-search"></i>

Check Status

</button>


</form>


</div>


</div>



{% endblock %}
